[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mps-fixture-pure"
version = "0.1.0"
description = "Integration fixture for MPSActions pure Python releases."
requires-python = ">=3.11"

[project.optional-dependencies]
testing = ["pytest>=8,<10"]
documentation = ["sphinx>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
