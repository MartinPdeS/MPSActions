name: Publish Python Package Release
'on':
  workflow_call:
    inputs:
      pypi_python_version:
        required: false
        type: string
        default: '3.11'
      pypi_package_type:
        required: false
        type: string
        default: compiled
        description: 'PyPI build mode: pure or compiled.'
      pypi_build_linux:
        required: false
        type: boolean
        default: false
      pypi_build_macos:
        required: false
        type: boolean
        default: false
      pypi_build_windows:
        required: false
        type: boolean
        default: false
      pypi_project_directory:
        required: false
        type: string
        default: .
      pypi_test_import:
        required: false
        type: string
        default: ''
      pypi_test_command:
        required: false
        type: string
        default: ''
      pypi_runner:
        required: false
        type: string
        default: ubuntu-latest
      release_validation_command:
        required: false
        type: string
        default: ''
        description: Optional command to validate the repository tag and release metadata.
      pypi_apt_package:
        required: false
        type: string
        default: ''
      pypi_brew_package:
        required: false
        type: string
        default: ''
      pypi_mingw_package:
        required: false
        type: string
        default: ''
      conda_python_versions:
        required: true
        type: string
      conda_os_list:
        required: true
        type: string
      conda_package_name:
        required: true
        type: string
      conda_recipe_path:
        required: false
        type: string
        default: .
      conda_test_import:
        required: false
        type: string
        default: ''
      conda_test_command:
        required: false
        type: string
        default: ''
      conda_apt_package:
        required: false
        type: string
        default: ''
      conda_brew_package:
        required: false
        type: string
        default: ''
      conda_channels:
        required: false
        type: string
        default: martinpdes,conda-forge
      conda_max_artifact_size_mb:
        required: false
        type: number
        default: 500
      conda_upload_user:
        required: false
        type: string
        default: martinpdes
      download_retries:
        type: number
        required: false
        default: 3
        description: "Additional attempts for transient download failures (0\u201310)."
      retry_delay_seconds:
        type: number
        required: false
        default: 10
        description: Initial retry delay; increases linearly, capped at 60 seconds.
      pypi_linux_runner:
        type: string
        required: false
        default: ubuntu-latest
      pypi_macos_runner:
        type: string
        required: false
        default: macos-latest
      pypi_windows_runner:
        type: string
        required: false
        default: windows-latest
      pypi_macos_deployment_target:
        type: string
        required: false
        default: '26.0'
      pypi_xcode_version:
        type: string
        required: false
        default: ''
      pypi_macos_install_gcc:
        type: boolean
        required: false
        default: true
      pypi_macos_install_fortran:
        type: boolean
        required: false
        default: true
      pypi_cibuildwheel_version:
        type: string
        required: false
        default: 4.2.0
      conda_tools_python_version:
        type: string
        required: false
        default: '3.11'
      conda_build_version:
        type: string
        required: false
        default: <26
      conda_miniforge_version:
        type: string
        required: false
        default: 26.7.2-0
      debug:
        type: boolean
        required: false
        default: false
      pypi_package_name:
        type: string
        required: false
        default: ''
        description: PyPI distribution name; defaults to the Conda package name.
      documentation:
        required: false
        type: boolean
        default: false
        description: Build documentation before publication; deploy only after both registries succeed.
      documentation_python_version:
        required: false
        type: string
        default: '3.11'
      documentation_package_name:
        required: false
        type: string
        default: ''
      documentation_apt_package:
        required: false
        type: string
        default: ''
      documentation_retain_versions:
        required: false
        type: number
        default: 0
    secrets:
      PYPI_API_TOKEN:
        required: true
      ANACONDA_API_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pypi: ${{ steps.plan.outputs.pypi }}
      conda: ${{ steps.plan.outputs.conda }}
    steps:
    - name: Check out repository for release validation
      if: inputs.release_validation_command != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up Python for release validation
      if: inputs.release_validation_command != ''
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ inputs.pypi_python_version }}
    - name: Validate release metadata
      if: inputs.release_validation_command != ''
      run: |
        set -Eeuo pipefail
        ${{ inputs.release_validation_command }}
    - name: Plan release artifacts
      run: |
        set -Eeuo pipefail
        python - <<'PYTHON'
        import json, os
        package_type = os.environ['PACKAGE_TYPE']
        if package_type == 'pure':
            pypi = ['wheels-pure']
        elif package_type == 'compiled':
            pypi = ['wheels-' + p for p in ('linux', 'macos', 'windows') if os.environ[p.upper()] == 'true']
        else:
            raise SystemExit(f'Unsupported pypi_package_type: {package_type!r}')
        conda = ['conda-package-' + runner + '-py' + version for runner in json.loads(os.environ['RUNNERS']) for version in json.loads(os.environ['PYTHONS'])]
        if not pypi:
            raise SystemExit('The PyPI artifact matrix must not be empty.')
        if not conda:
            raise SystemExit('The Conda artifact matrix must not be empty.')
        print('Release reference:', os.environ['GITHUB_REF'])
        print('Source commit:', os.environ['GITHUB_SHA'])
        print('Expected PyPI builds:', json.dumps(pypi))
        print('Expected Conda builds:', json.dumps(conda))
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('pypi=' + json.dumps(pypi) + '\n')
            output.write('conda=' + json.dumps(conda) + '\n')
        PYTHON
      env:
        LINUX: ${{ inputs.pypi_build_linux }}
        MACOS: ${{ inputs.pypi_build_macos }}
        WINDOWS: ${{ inputs.pypi_build_windows }}
        PACKAGE_TYPE: ${{ inputs.pypi_package_type }}
        RUNNERS: ${{ inputs.conda_os_list }}
        PYTHONS: ${{ inputs.conda_python_versions }}
      id: plan
  pypi_pure:
    if: inputs.pypi_package_type == 'pure'
    uses: ./.github/workflows/build_pure_package.yml
    with:
      python_version: ${{ inputs.pypi_python_version }}
      runner: ${{ inputs.pypi_runner }}
      project_directory: ${{ inputs.pypi_project_directory }}
      test_import: ${{ inputs.pypi_test_import }}
      test_command: ${{ inputs.pypi_test_command }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
      artifact_identity: wheels-pure
    needs: plan
  pypi_compiled:
    if: inputs.pypi_package_type == 'compiled'
    uses: ./.github/workflows/build_wheels.yml
    with:
      python_version: ${{ inputs.pypi_python_version }}
      build_linux: ${{ inputs.pypi_build_linux }}
      build_macos: ${{ inputs.pypi_build_macos }}
      build_windows: ${{ inputs.pypi_build_windows }}
      apt_package: ${{ inputs.pypi_apt_package }}
      brew_package: ${{ inputs.pypi_brew_package }}
      mingw_package: ${{ inputs.pypi_mingw_package }}
      linux_runner: ${{ inputs.pypi_linux_runner }}
      macos_runner: ${{ inputs.pypi_macos_runner }}
      windows_runner: ${{ inputs.pypi_windows_runner }}
      macos_deployment_target: ${{ inputs.pypi_macos_deployment_target }}
      xcode_version: ${{ inputs.pypi_xcode_version }}
      macos_install_gcc: ${{ inputs.pypi_macos_install_gcc }}
      macos_install_fortran: ${{ inputs.pypi_macos_install_fortran }}
      cibuildwheel_version: ${{ inputs.pypi_cibuildwheel_version }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
      debug: ${{ inputs.debug }}
    needs: plan
  conda:
    uses: ./.github/workflows/build_conda_matrix.yml
    with:
      python_versions: ${{ inputs.conda_python_versions }}
      os_list: ${{ inputs.conda_os_list }}
      package_name: ${{ inputs.conda_package_name }}
      recipe_path: ${{ inputs.conda_recipe_path }}
      test_import: ${{ inputs.conda_test_import }}
      test_command: ${{ inputs.conda_test_command }}
      apt_package: ${{ inputs.conda_apt_package }}
      brew_package: ${{ inputs.conda_brew_package }}
      max_artifact_size_mb: ${{ inputs.conda_max_artifact_size_mb }}
      conda_channels: ${{ inputs.conda_channels }}
      tools_python_version: ${{ inputs.conda_tools_python_version }}
      conda_build_version: ${{ inputs.conda_build_version }}
      miniforge_version: ${{ inputs.conda_miniforge_version }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
      debug: ${{ inputs.debug }}
    needs: plan
  validate:
    if: |-
      always() && needs.plan.result == 'success' && needs.conda.result == 'success' && (needs.pypi_pure.result == 'success' || needs.pypi_compiled.result == 'success') &&
      (!inputs.documentation || needs.documentation_build.result == 'success')
    needs:
    - plan
    - pypi_pure
    - pypi_compiled
    - conda
    - documentation_build
    uses: ./.github/workflows/validate_release.yml
    with:
      wheel_identities: ${{ needs.plan.outputs.pypi }}
      conda_identities: ${{ needs.plan.outputs.conda }}
      package_name: ${{ inputs.conda_package_name }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
      pypi_package_name: ${{ inputs.pypi_package_name != '' && inputs.pypi_package_name || inputs.conda_package_name }}
  publish_pypi:
    needs:
    - plan
    - validate
    uses: ./.github/workflows/publish_distributions.yml
    with:
      registry: pypi
      artifact_identities: ${{ needs.plan.outputs.pypi }}
      python_version: ${{ inputs.pypi_python_version }}
      conda_upload_user: ${{ inputs.conda_upload_user }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    if: '!cancelled() && needs.validate.result == ''success'''
  publish_conda:
    needs:
    - plan
    - validate
    uses: ./.github/workflows/publish_distributions.yml
    with:
      registry: conda
      artifact_identities: ${{ needs.plan.outputs.conda }}
      python_version: ${{ inputs.pypi_python_version }}
      conda_upload_user: ${{ inputs.conda_upload_user }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
    secrets:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
    if: '!cancelled() && needs.validate.result == ''success'''
  documentation_build:
    needs: plan
    if: inputs.documentation
    uses: ./.github/workflows/build_documentation.yml
    with:
      python-version: ${{ inputs.documentation_python_version }}
      package-name: ${{ inputs.documentation_package_name != '' && inputs.documentation_package_name || inputs.conda_package_name
        }}
      apt-package: ${{ inputs.documentation_apt_package }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
      debug: ${{ inputs.debug }}
  documentation_publish:
    needs:
    - publish_pypi
    - publish_conda
    - documentation_build
    if: '!cancelled() && inputs.documentation && needs.publish_pypi.result == ''success'' && needs.publish_conda.result ==
      ''success'' && needs.documentation_build.result == ''success'''
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_documentation.yml
    with:
      python-version: ${{ inputs.documentation_python_version }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
      retain_versions: ${{ inputs.documentation_retain_versions }}
  summary:
    if: always()
    needs:
    - plan
    - pypi_pure
    - pypi_compiled
    - conda
    - documentation_build
    - validate
    - publish_pypi
    - publish_conda
    - documentation_publish
    runs-on: ubuntu-latest
    steps:
    - name: Report every release stage
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python - <<'PYTHON'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        lines = ['### Release stages', '', '| Stage | Result |', '| --- | --- |']
        for name, details in results.items():
            print(f"{name}: {details['result']}")
            lines.append(f"| {name} | {details['result']} |")
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
            output.write('\n'.join(lines) + '\n')
        PYTHON
