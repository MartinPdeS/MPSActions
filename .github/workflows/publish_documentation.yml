name: Build and publish documentation
'on':
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      package-name:
        required: true
        type: string
      apt-package:
        required: false
        type: string
        default: ''
      source-ref:
        required: false
        type: string
        default: ''
      fail-on-sphinx-warning:
        required: false
        type: boolean
        default: false
      deploy-pages:
        description: Whether to publish documentation updates to the configured Pages source branch.
        required: false
        type: boolean
        default: true
      download_retries:
        type: number
        required: false
        default: 3
        description: "Additional attempts for transient download failures (0\u201310)."
      retry_delay_seconds:
        type: number
        required: false
        default: 10
        description: Initial retry delay; increases linearly, capped at 60 seconds.
      debug:
        type: boolean
        required: false
        default: false
      documentation_branch:
        type: string
        required: false
        default: documentation_page
      base_url:
        type: string
        required: false
        default: ''
      project_directory:
        type: string
        required: false
        default: .
      retain_versions:
        type: number
        default: 0
        description: Number of versioned releases to retain; zero keeps all.
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build_documentation.yml
    with:
      python-version: ${{ inputs.python-version }}
      package-name: ${{ inputs.package-name }}
      apt-package: ${{ inputs.apt-package }}
      source-ref: ${{ inputs.source-ref }}
      fail-on-sphinx-warning: ${{ inputs.fail-on-sphinx-warning }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
      debug: ${{ inputs.debug }}
      project_directory: ${{ inputs.project_directory }}
  deploy:
    needs: build
    if: inputs.deploy-pages && github.event_name == 'push'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_documentation.yml
    with:
      python-version: ${{ inputs.python-version }}
      documentation_branch: ${{ inputs.documentation_branch }}
      base_url: ${{ inputs.base_url }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
      retain_versions: ${{ inputs.retain_versions }}
