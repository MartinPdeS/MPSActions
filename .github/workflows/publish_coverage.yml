name: Build and Upload Package Coverage

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      apt-package:
        required: false
        type: string
        default: ""
      coverage-package:
        description: Optional Python package to measure with coverage.
        required: false
        type: string
        default: ""

    secrets:
      _GITHUB_TOKEN:
        required: true

jobs:
  coverage:
    name: Run test and generate coverage data
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install apt dependencies
        if: inputs.apt-package != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-package }}

      - name: Checkout requirements and files for testing
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          submodules: true

      - name: Install everything
        run: |
          python -m pip install --upgrade pip wheel build
          python -m pip install -e .[testing]

      - name: Run pytest with coverage
        run: |
          coverage_arguments=()
          if [ -n "${{ inputs.coverage-package }}" ]; then
            coverage_arguments+=("--cov=${{ inputs.coverage-package }}")
          fi
          python -m pytest "${coverage_arguments[@]}" \
            --import-mode=importlib \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            tests \
            --config-file=pytest.ini

      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71
        with:
          GITHUB_TOKEN: ${{ secrets._GITHUB_TOKEN }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 50
          COVERAGE_PATH: .
