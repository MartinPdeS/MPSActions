name: Run package tests
'on':
  workflow_call:
    inputs:
      python-versions:
        type: string
        required: false
        default: '["3.11"]'
      install-command:
        type: string
        required: true
      test-command:
        type: string
        required: true
      apt-package:
        type: string
        required: false
        default: ''
      fetch-depth:
        type: number
        required: false
        default: 0
      submodules:
        type: string
        required: false
        default: 'false'
      working-directory:
        type: string
        required: false
        default: .
      debug:
        type: boolean
        required: false
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    env:
      MPLBACKEND: Agg
      PYVISTA_OFF_SCREEN: 'true'
      PROJECT_DIRECTORY: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          submodules: ${{ inputs.submodules }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        if: inputs.apt-package != ''
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-package }}
      - name: Install package and test dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -Eeuo pipefail
          ${{ inputs.install-command }}
      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -Eeuo pipefail
          ${{ inputs.test-command }}
      - name: Debug test environment
        if: always() && inputs.debug
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -Eeuo pipefail
          python --version
          python -m pip list
          git log -1 --oneline
