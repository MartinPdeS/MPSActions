'on':
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        required: true
    inputs:
      python-version:
        required: true
        type: string
      build-Linux:
        type: boolean
        default: false
      build-macOS:
        type: boolean
        default: false
      build-Windows:
        type: boolean
        default: false
      brew-package:
        type: string
        default: ''
      apt-package:
        type: string
        default: ''
      mingw-package:
        type: string
        default: ''
      download_retries:
        type: number
        required: false
        default: 3
        description: "Additional attempts for transient download failures (0\u201310)."
      retry_delay_seconds:
        type: number
        required: false
        default: 10
        description: Initial retry delay; increases linearly, capped at 60 seconds.
      linux_runner:
        type: string
        required: false
        default: ubuntu-latest
      macos_runner:
        type: string
        required: false
        default: macos-latest
      windows_runner:
        type: string
        required: false
        default: windows-latest
      macos_deployment_target:
        type: string
        required: false
        default: '26.0'
      xcode_version:
        type: string
        required: false
        default: ''
      macos_install_gcc:
        type: boolean
        required: false
        default: true
      macos_install_fortran:
        type: boolean
        required: false
        default: true
      cibuildwheel_version:
        type: string
        required: false
        default: 4.2.0
      project-directory:
        type: string
        required: false
        default: .
      debug:
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      identities: ${{ steps.plan.outputs.identities }}
    steps:
    - name: Plan wheel artifacts
      run: |
        set -Eeuo pipefail
        python - <<'PYTHON'
        import json, os
        ids = ['wheels-' + p for p in ('linux', 'macos', 'windows') if os.environ[p.upper()] == 'true']
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('identities=' + json.dumps(ids) + '\n')
        PYTHON
      env:
        LINUX: ${{ inputs.build-Linux }}
        MACOS: ${{ inputs.build-macOS }}
        WINDOWS: ${{ inputs.build-Windows }}
      id: plan
  build:
    needs: plan
    uses: ./.github/workflows/build_wheels.yml
    with:
      python_version: ${{ inputs.python-version }}
      build_linux: ${{ inputs.build-Linux }}
      build_macos: ${{ inputs.build-macOS }}
      build_windows: ${{ inputs.build-Windows }}
      apt_package: ${{ inputs.apt-package }}
      brew_package: ${{ inputs.brew-package }}
      mingw_package: ${{ inputs.mingw-package }}
      project_directory: ${{ inputs.project-directory }}
      linux_runner: ${{ inputs.linux_runner }}
      macos_runner: ${{ inputs.macos_runner }}
      windows_runner: ${{ inputs.windows_runner }}
      macos_deployment_target: ${{ inputs.macos_deployment_target }}
      xcode_version: ${{ inputs.xcode_version }}
      macos_install_gcc: ${{ inputs.macos_install_gcc }}
      macos_install_fortran: ${{ inputs.macos_install_fortran }}
      cibuildwheel_version: ${{ inputs.cibuildwheel_version }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
      debug: ${{ inputs.debug }}
  validate:
    needs:
    - plan
    - build
    uses: ./.github/workflows/validate_release.yml
    with:
      validate_conda: false
      wheel_identities: ${{ needs.plan.outputs.identities }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
  publish:
    needs:
    - plan
    - validate
    uses: ./.github/workflows/publish_distributions.yml
    with:
      registry: pypi
      artifact_identities: ${{ needs.plan.outputs.identities }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
