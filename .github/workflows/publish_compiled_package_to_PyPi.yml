on:
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        required: true
    inputs:
      python-version:
        required: true
        type: string
      build-Linux:
        type: boolean
        default: false
      build-macOS:
        type: boolean
        default: false
      build-Windows:
        type: boolean
        default: false
      brew-package:
        type: string
        default: ""
      apt-package:
        type: string
        default: ""
      mingw-package:
        type: string
        default: ""

jobs:

  linux:
    if: ${{ inputs.build-Linux }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          submodules: true

      - name: Install apt packages
        if: ${{ inputs.apt-package != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-package }}

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074
        env:
          CC: gcc
          CXX: g++
        with:
          output-dir: dist

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux_wheels
          path: dist/*

  macos:
    if: ${{ inputs.build-macOS }}
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.6"

      - name: Install GCC
        run: |
          brew update
          brew install gcc
     
      - name: "Setup GNU Fortran"
        id: setup-fortran
        uses: fortran-lang/setup-fortran@3367da2fee129ed4b7e4ba439ea3394ca40e396b
          

      - name: Install brew packages
        if: ${{ inputs.brew-package != '' }}
        run: |
          brew install ${{ inputs.brew-package }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          submodules: true

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074
        env:
          PYVISTA_OFF_SCREEN: "true"
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        with:
          output-dir: dist

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos_wheels
          path: dist/*

  windows:
    if: ${{ inputs.build-Windows }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          submodules: true

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        if: ${{ inputs.mingw-package != '' }}
        id: msys2
        with:
          msystem: MINGW64
          install: ${{ inputs.mingw-package }}
          path-type: inherit
          # A fresh setup avoids transient GitHub cache-service failures.
          cache: false

      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67

      - name: Add MSYS2 to PATH
        run: |
          echo "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" >> $env:GITHUB_PATH

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074
        env:
          CMAKE_ARGS: "-DPKG_CONFIG_EXECUTABLE=${{ steps.msys2.outputs.msys2-location }}/mingw64/bin/pkg-config.exe"
          CMAKE_GENERATOR: Ninja
        with:
          output-dir: dist

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows_wheels
          path: dist/*

  publish:
    if: >
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      !cancelled() &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python-version }}

      - run: |
          python -m pip install -U pip
          python -m pip install twine

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: dist

      - name: Release to PyPI
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0
        with:
          packages_dir: dist/*/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
