name: Build and Upload Wheel
'on':
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      test-command:
        description: Optional command to run after installing the wheel in a fresh environment.
        required: false
        type: string
        default: ''
      download_retries:
        type: number
        required: false
        default: 3
        description: "Additional attempts for transient download failures (0\u201310)."
      retry_delay_seconds:
        type: number
        required: false
        default: 10
        description: Initial retry delay; increases linearly, capped at 60 seconds.
      runner:
        type: string
        required: false
        default: ubuntu-latest
      project_directory:
        type: string
        required: false
        default: .
      test_import:
        type: string
        required: false
        default: ''
    secrets:
      PYPI_API_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build_pure_package.yml
    with:
      python_version: ${{ inputs.python-version }}
      test_command: ${{ inputs.test-command }}
      runner: ${{ inputs.runner }}
      project_directory: ${{ inputs.project_directory }}
      test_import: ${{ inputs.test_import }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
  validate:
    needs: build
    uses: ./.github/workflows/validate_release.yml
    with:
      validate_conda: false
      wheel_identities: '["wheels-pure"]'
  publish:
    needs: validate
    uses: ./.github/workflows/publish_distributions.yml
    with:
      registry: pypi
      artifact_identities: '["wheels-pure"]'
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
