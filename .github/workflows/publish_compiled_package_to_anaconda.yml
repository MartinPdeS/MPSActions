name: Build and Upload Conda Package
'on':
  workflow_call:
    inputs:
      python_versions:
        description: JSON list of Python versions to build.
        required: true
        type: string
      os_list:
        description: JSON list of GitHub Actions runners.
        required: true
        type: string
      package_name:
        description: Name of the Conda package to install for verification.
        required: true
        type: string
      test_import:
        description: Deprecated Python import target for installed-package verification.
        type: string
        required: false
        default: ''
      test_command:
        description: Optional command to run in the clean Conda test environment.
        type: string
        required: false
        default: ''
      apt_package:
        required: false
        type: string
        default: ''
      brew_package:
        required: false
        type: string
        default: ''
      conda_channels:
        required: false
        type: string
        default: martinpdes,conda-forge
      recipe_path:
        description: Path to the Conda recipe directory or meta.yaml file.
        required: false
        type: string
        default: .
      max_artifact_size_mb:
        description: Maximum permitted Conda archive size in MiB.
        required: false
        type: number
        default: 500
      conda_upload_user:
        required: false
        type: string
        default: martinpdes
      download_retries:
        type: number
        required: false
        default: 3
        description: "Additional attempts for transient download failures (0\u201310)."
      retry_delay_seconds:
        type: number
        required: false
        default: 10
        description: Initial retry delay; increases linearly, capped at 60 seconds.
      tools_python_version:
        type: string
        required: false
        default: '3.11'
      conda_build_version:
        type: string
        required: false
        default: <26
      miniforge_version:
        type: string
        required: false
        default: 26.7.2-0
      debug:
        type: boolean
        required: false
        default: false
    secrets:
      ANACONDA_API_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      identities: ${{ steps.plan.outputs.identities }}
    steps:
    - name: Plan Conda artifacts
      run: |
        set -Eeuo pipefail
        python - <<'PYTHON'
        import json, os
        ids = ['conda-package-' + runner + '-py' + version for runner in json.loads(os.environ['RUNNERS']) for version in json.loads(os.environ['PYTHONS'])]
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('identities=' + json.dumps(ids) + '\n')
        PYTHON
      env:
        RUNNERS: ${{ inputs.os_list }}
        PYTHONS: ${{ inputs.python_versions }}
      id: plan
  build:
    needs: plan
    uses: ./.github/workflows/build_conda_matrix.yml
    with:
      python_versions: ${{ inputs.python_versions }}
      os_list: ${{ inputs.os_list }}
      package_name: ${{ inputs.package_name }}
      test_import: ${{ inputs.test_import }}
      test_command: ${{ inputs.test_command }}
      apt_package: ${{ inputs.apt_package }}
      brew_package: ${{ inputs.brew_package }}
      conda_channels: ${{ inputs.conda_channels }}
      recipe_path: ${{ inputs.recipe_path }}
      max_artifact_size_mb: ${{ inputs.max_artifact_size_mb }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
      tools_python_version: ${{ inputs.tools_python_version }}
      conda_build_version: ${{ inputs.conda_build_version }}
      miniforge_version: ${{ inputs.miniforge_version }}
      debug: ${{ inputs.debug }}
  validate:
    needs:
    - plan
    - build
    uses: ./.github/workflows/validate_release.yml
    with:
      validate_pypi: false
      conda_identities: ${{ needs.plan.outputs.identities }}
      package_name: ${{ inputs.package_name }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
  publish:
    needs:
    - plan
    - validate
    uses: ./.github/workflows/publish_distributions.yml
    with:
      registry: conda
      artifact_identities: ${{ needs.plan.outputs.identities }}
      conda_upload_user: ${{ inputs.conda_upload_user }}
      download_retries: ${{ inputs.download_retries }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds }}
    secrets:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
