name: Build and Upload Conda Package

on:
  workflow_call:
    inputs:
      python_versions:
        description: JSON list of Python versions to build.
        required: true
        type: string
      os_list:
        description: JSON list of GitHub Actions runners.
        required: true
        type: string
      package_name:
        description: Name of the Conda package to install for verification.
        required: true
        type: string
      test_import:
        description: Deprecated Python import target for installed-package verification.
        type: string
        required: false
        default: ""
      test_command:
        description: Optional command to run in the clean Conda test environment.
        type: string
        required: false
        default: ""
      apt_package:
        required: false
        type: string
        default: ""
      brew_package:
        required: false
        type: string
        default: ""
      conda_channels:
        required: false
        type: string
        default: "martinpdes,conda-forge"
      conda_upload_user:
        required: false
        type: string
        default: "martinpdes"
    secrets:
      ANACONDA_API_TOKEN:
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os_list) }}
        python: ${{ fromJson(inputs.python_versions) }}
    uses: MartinPdeS/MPSActions/.github/workflows/build_conda_package.yml@v1
    with:
      os: ${{ matrix.os }}
      python_version: ${{ matrix.python }}
      package_name: ${{ inputs.package_name }}
      test_import: ${{ inputs.test_import }}
      test_command: ${{ inputs.test_command }}
      apt_package: ${{ inputs.apt_package }}
      brew_package: ${{ inputs.brew_package }}
      conda_channels: ${{ inputs.conda_channels }}

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-update-conda: false
          auto-activate: true
          activate-environment: base
          channels: ${{ inputs.conda_channels }}
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install Anaconda client
        run: |
          set -Eeuo pipefail
          conda install -n base -y --override-channels -c conda-forge anaconda-client
          conda run -n base anaconda --help >/dev/null

      - name: Download verified packages
        uses: actions/download-artifact@v5
        with:
          pattern: conda-package-*
          path: conda-build-artifacts
          merge-multiple: true

      - name: Upload packages to Anaconda
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(find conda-build-artifacts -type f \( -name '*.conda' -o -name '*.tar.bz2' \))
          [ "${#packages[@]}" -gt 0 ] || { echo "No Conda packages were downloaded."; exit 1; }

          for package_path in "${packages[@]}"; do
            conda run -n base anaconda --token "${ANACONDA_API_TOKEN}" upload \
              --user "${{ inputs.conda_upload_user }}" \
              --force "${package_path}"
          done
