name: Build Conda Package

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python_version:
        required: true
        type: string
      package_name:
        required: true
        type: string
      test_import:
        description: Deprecated Python import target for installed-package verification.
        type: string
        required: false
        default: ""
      test_command:
        description: Optional command to run in the clean Conda test environment.
        type: string
        required: false
        default: ""
      apt_package:
        required: false
        type: string
        default: ""
      brew_package:
        required: false
        type: string
        default: ""
      conda_channels:
        required: false
        type: string
        default: "martinpdes,conda-forge"
      recipe_path:
        description: Path to the Conda recipe directory or meta.yaml file.
        required: false
        type: string
        default: "."
      max_artifact_size_mb:
        description: Maximum permitted Conda archive size in MiB.
        required: false
        type: number
        default: 500

defaults:
  run:
    shell: bash -l {0}

jobs:
  build:
    name: Build / ${{ inputs.os }} / Python ${{ inputs.python_version }}
    runs-on: ${{ inputs.os }}
    env:
      CONDA_BUILD_OUTPUT_DIRECTORY: conda-build-artifacts

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          submodules: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && inputs.apt_package != ''
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt_package }}

      - name: Install macOS build dependencies
        if: runner.os == 'macOS' && inputs.brew_package != ''
        run: |
          set -Eeuo pipefail
          brew update
          brew install ${{ inputs.brew_package }}

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5
        with:
          miniforge-version: latest
          auto-update-conda: false
          auto-activate: true
          activate-environment: base
          python-version: ${{ inputs.python_version }}
          channels: ${{ inputs.conda_channels }}
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install Conda build tools
        run: |
          set -Eeuo pipefail
          conda install -n base -y --override-channels -c conda-forge "conda-build<26"
          conda --version
          conda-build --version

      - name: Build package
        run: |
          set -Eeuo pipefail
          IFS=',' read -ra channels <<< "${{ inputs.conda_channels }}"
          channel_arguments=()
          for channel in "${channels[@]}"; do
            channel="$(echo "${channel}" | xargs)"
            [ -z "${channel}" ] || channel_arguments+=("-c" "${channel}")
          done

          rm -rf "${CONDA_BUILD_OUTPUT_DIRECTORY}"
          mkdir -p "${CONDA_BUILD_OUTPUT_DIRECTORY}"

          # conda-build currently creates an invalid *_debug_cpython
          # constraint for its own test environment. The artifact is tested
          # independently in the next step.
          conda-build "${{ inputs.recipe_path }}" --no-test --python "${{ inputs.python_version }}" \
            --override-channels "${channel_arguments[@]}" \
            --output-folder "${CONDA_BUILD_OUTPUT_DIRECTORY}"

      - name: Verify the installed artifact
        run: |
          set -Eeuo pipefail
          test_prefix="${RUNNER_TEMP}/conda-package-test"
          find "${CONDA_BUILD_OUTPUT_DIRECTORY}" -type f \( -name '*.conda' -o -name '*.tar.bz2' \) -print -quit | grep -q . || { echo "No Conda package was built."; exit 1; }

          IFS=',' read -ra channels <<< "${{ inputs.conda_channels }}"
          local_channel="$(python -c 'import os; from pathlib import Path; print((Path(os.environ["GITHUB_WORKSPACE"]) / os.environ["CONDA_BUILD_OUTPUT_DIRECTORY"]).resolve().as_uri())')"
          channel_arguments=("-c" "${local_channel}")
          for channel in "${channels[@]}"; do
            channel="$(echo "${channel}" | xargs)"
            [ -z "${channel}" ] || channel_arguments+=("-c" "${channel}")
          done

          rm -rf "${test_prefix}"
          conda create -y -p "${test_prefix}" --override-channels \
            "${channel_arguments[@]}" \
            "python=${{ inputs.python_version }}" "${{ inputs.package_name }}"
          cd "${RUNNER_TEMP}"
          if [ -n "${{ inputs.test_command }}" ]; then
            conda run -p "${test_prefix}" bash -c "${{ inputs.test_command }}"
          elif [ -n "${{ inputs.test_import }}" ]; then
            conda run -p "${test_prefix}" python -c "import ${{ inputs.test_import }}"
          else
            echo "No installed-package verification command was configured."
          fi

      - name: Check artifact size and create manifest
        run: |
          set -Eeuo pipefail
          manifest="${CONDA_BUILD_OUTPUT_DIRECTORY}/ARTIFACTS.sha256"
          : > "${manifest}"
          while IFS= read -r package_path; do
            size_bytes="$(wc -c < "${package_path}" | tr -d ' ')"
            size_mib=$((size_bytes / 1024 / 1024))
            printf '%s MiB  %s\n' "${size_mib}" "${package_path}"
            if [ "${size_mib}" -gt "${{ inputs.max_artifact_size_mb }}" ]; then
              echo "Artifact exceeds ${{ inputs.max_artifact_size_mb }} MiB: ${package_path}" >&2
              exit 1
            fi
            sha256sum "${package_path}" >> "${manifest}"
          done < <(find "${CONDA_BUILD_OUTPUT_DIRECTORY}" -type f \( -name '*.conda' -o -name '*.tar.bz2' \) | sort)

      - name: Upload built package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: conda-package-${{ inputs.os }}-py${{ inputs.python_version }}
          path: |
            conda-build-artifacts/**/*.conda
            conda-build-artifacts/**/*.tar.bz2
          if-no-files-found: error
